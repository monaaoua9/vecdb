syntax = "proto3";

package vecdb.v1;

service VectorDb {
  rpc Insert(InsertRequest) returns (InsertResponse);
  // insert, or replace vector and payload when the id exists
  rpc Upsert(InsertRequest) returns (InsertResponse);
  rpc UpdatePayload(UpdatePayloadRequest) returns (UpdatePayloadResponse);
  // client-streaming bulk load; one response after the stream closes
  rpc InsertStream(stream InsertRequest) returns (InsertStreamResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  // runs the queries concurrently, results come back in the same order
  rpc SearchBatch(BatchSearchRequest) returns (BatchSearchResponse);
  rpc Recommend(RecommendRequest) returns (SearchResponse);
  rpc Count(CountRequest) returns (CountResponse);
  // pages through the collection in insertion order, see ScrollRequest.cursor
  rpc Scroll(ScrollRequest) returns (ScrollResponse);
  rpc Facets(FacetsRequest) returns (FacetsResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
  // write a snapshot into the server's data directory
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);

  // read-replica feed: the newest snapshot, then the write-ahead log from that snapshot on
  rpc Replicate(ReplicateRequest) returns (stream ReplicationMessage);

  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
}

// Every data RPC above acts on the collection named in the `x-collection` request
// metadata; without the header it is the "default" collection (the index the server
// was started with).

message Value {
  oneof kind {
    bool bool_value = 1;
    int64 int_value = 2;
    double float_value = 3;
    string string_value = 4;
  }
}

message Payload {
  map<string, Value> fields = 1;
}

message Filter {
  oneof kind {
    FieldMatch match = 1;
    FieldMatchAny match_any = 2;
    FieldRange range = 3;
    FilterList and = 4;
    FilterList or = 5;
    Filter not = 6;
  }
}

message FieldMatch {
  string field = 1;
  Value value = 2;
}

message FieldMatchAny {
  string field = 1;
  repeated Value values = 2;
}

// inclusive bounds, either side may be left open
message FieldRange {
  string field = 1;
  optional double min = 2;
  optional double max = 3;
}

message FilterList {
  repeated Filter filters = 1;
}

enum FilterStrategy {
  FILTER_STRATEGY_AUTO = 0;
  FILTER_STRATEGY_PRE = 1;
  FILTER_STRATEGY_POST = 2;
}

message InsertRequest {
  uint64 id = 1;
  repeated float vector = 2;
  Payload payload = 3;
}

message InsertResponse {}

message UpdatePayloadRequest {
  uint64 id = 1;
  Payload payload = 2;
  // false replaces the whole payload, true only sets the listed fields
  bool merge = 3;
}

message UpdatePayloadResponse {}

message InsertStreamResponse {
  uint64 inserted = 1;
}

message SearchRequest {
  repeated float vector = 1;
  uint32 k = 2;
  // beam width, 0 = server default
  uint32 ef = 3;
  optional Filter filter = 4;
  FilterStrategy strategy = 5;
  bool with_payload = 6;
  // only hits within this distance, nearest first, at most k of them
  optional float radius = 7;
  // diversify with maximal marginal relevance: 1 = plain order, lower = more spread out
  optional float mmr_lambda = 8;
  // candidates considered by mmr, 0 = 4 * k
  uint32 mmr_fetch = 9;
  // keywords for BM25 over the collection's text field (server needs --text-field).
  // text alone = keyword search, text + vector = hybrid (reciprocal rank fusion);
  // distance is then a negated score, not a geometric distance
  optional string text = 10;
}

message BatchSearchRequest {
  repeated SearchRequest queries = 1;
}

message BatchSearchResponse {
  repeated SearchResponse results = 1;
}

// searches around 2 * mean(positive) - mean(negative); the given ids are never returned
message RecommendRequest {
  repeated uint64 positive = 1;
  repeated uint64 negative = 2;
  uint32 k = 3;
  uint32 ef = 4;
  optional Filter filter = 5;
  FilterStrategy strategy = 6;
  bool with_payload = 7;
}

message Hit {
  uint64 id = 1;
  // lower is closer: squared L2, 1 - cosine, or negative inner product
  float distance = 2;
  Payload payload = 3;
}

message SearchResponse {
  repeated Hit hits = 1;
  uint64 took_micros = 2;
}

message GetRequest {
  uint64 id = 1;
}

message GetResponse {
  uint64 id = 1;
  repeated float vector = 2;
  Payload payload = 3;
}

message DeleteRequest {
  uint64 id = 1;
}

message DeleteResponse {}

message StatsRequest {}

message StatsResponse {
  uint64 live = 1;
  uint64 deleted = 2;
  uint64 capacity = 3;
  uint32 max_level = 4;
  uint64 layer0_edges = 5;
  uint32 dim = 6;
  string metric = 7;
  string quantization = 8;
  string simd_kernel = 9;
  uint64 heap_vector_bytes = 10;
  uint64 mapped_bytes = 11;
}

message SnapshotRequest {}

message SnapshotResponse {
  string path = 1;
  uint64 vectors = 2;
}

enum MetricKind {
  METRIC_KIND_L2 = 0;
  METRIC_KIND_COSINE = 1;
  METRIC_KIND_INNER_PRODUCT = 2;
}

enum QuantizationKind {
  QUANTIZATION_KIND_NONE = 0;
  QUANTIZATION_KIND_SQ8 = 1;
  QUANTIZATION_KIND_BINARY = 2;
}

// zero values mean "server default" for everything except dim
message CollectionConfig {
  uint32 dim = 1;
  MetricKind metric = 2;
  QuantizationKind quantization = 3;
  bool rerank = 4;
  uint32 m = 5;
  uint32 ef_construction = 6;
  uint32 ef_search = 7;
  uint64 max_elements = 8;
}

message CreateCollectionRequest {
  string name = 1;
  CollectionConfig config = 2;
}

message CreateCollectionResponse {}

message DropCollectionRequest {
  string name = 1;
}

message DropCollectionResponse {}

message ListCollectionsRequest {}

message CollectionInfo {
  string name = 1;
  uint32 dim = 2;
  string metric = 3;
  string quantization = 4;
  uint64 live = 5;
}

message ListCollectionsResponse {
  repeated CollectionInfo collections = 1;
}

message CountRequest {
  optional Filter filter = 1;
}

message CountResponse {
  uint64 count = 1;
}

message ScrollRequest {
  optional Filter filter = 1;
  // 0 to start, then the previous response's next_cursor. Stays valid across inserts and
  // deletes, not across a compaction or an upsert of an already-visited id
  uint64 cursor = 2;
  // 0 = 100, at most 10000
  uint32 limit = 3;
  bool with_vector = 4;
  bool with_payload = 5;
}

message ScrollItem {
  uint64 id = 1;
  repeated float vector = 2;
  Payload payload = 3;
}

message ScrollResponse {
  repeated ScrollItem items = 1;
  // absent on the last page
  optional uint64 next_cursor = 2;
}

message FacetsRequest {
  string field = 1;
  optional Filter filter = 2;
  // 0 = 20, at most 1000
  uint32 limit = 3;
}

message FacetCount {
  Value value = 1;
  uint64 count = 2;
}

message FacetsResponse {
  repeated FacetCount facets = 1;
}

message ReplicateRequest {}

message ReplicationMessage {
  oneof kind {
    Bootstrap bootstrap = 1;
    // bytes of the snapshot file, snapshot_bytes in total
    bytes snapshot_chunk = 2;
    WalChunk wal_chunk = 3;
    // the log the replica was reading no longer exists: start over from a new snapshot
    Resync resync = 4;
  }
}

message Bootstrap {
  // postcard-encoded vecdb::Config
  bytes config = 1;
  // generation of the snapshot (or of the oldest log when there is none)
  uint64 generation = 2;
  bool has_snapshot = 3;
  uint64 snapshot_bytes = 4;
}

// raw log bytes; chunk boundaries can fall inside a record
message WalChunk {
  uint64 generation = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message Resync {}
